# Wandb settings
project: 'AstroM3'
use_wandb: True

# Dataset settings
dataset: 'MeriDK/AstroM3Processed'
classes: ['EW', 'SR', 'EA', 'RRAB', 'EB', 'ROT', 'RRC', 'HADS', 'M', 'DSCT']
num_classes: 10
seq_len: 200
mode: 'photo'
data_sub: 'sub50'

# Photometry model parameters
p_enc_in: 9
p_d_model: 128
p_dropout: 0.30213979049376605
p_factor: 1
p_output_attention: False
p_n_heads: 4
p_d_ff: 512
p_activation: 'gelu'
p_e_layers: 8

# Training settings
use_pretrain: True
epochs: 50
batch_size: 512
lr: 0.00029281516232417676
beta1: 0.9738748415000176
beta2: 0.999
weight_decay: 5.80199133622127e-05
early_stopping_patience: 6
clip_grad: True
clip_value: 5
save_weights: True
weights_path: './weights/'

# Scheduler settings
scheduler: 'ReduceLROnPlateau'
scheduler_factor: 0.7740556090350126
scheduler_patience: 3
warmup_epochs: 10

