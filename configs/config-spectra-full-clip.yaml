# Wandb settings
project: 'AstroM3'
use_wandb: True

# Dataset settings
dataset: 'MeriDK/AstroM3Processed'
classes: ['EW', 'SR', 'EA', 'RRAB', 'EB', 'ROT', 'RRC', 'HADS', 'M', 'DSCT']
num_classes: 10
seq_len: 200
mode: 'spectra'
data_sub: 'full'

# Spectra model parameters
s_dropout: 0.3993914441570152
s_conv_channels: [3, 64, 64, 32, 32]
s_kernel_size: 3
s_mp_kernel_size: 4

# Training settings
use_pretrain: True
epochs: 50
batch_size: 512
lr: 0.002551272196821267
beta1: 0.8721148404707444
beta2: 0.999
weight_decay: 8.087959846227878e-05
early_stopping_patience: 6
clip_grad: True
clip_value: 5
save_weights: True
weights_path: './weights/'

# Scheduler settings
scheduler: 'ReduceLROnPlateau'
scheduler_factor: 0.6215150999952266
scheduler_patience: 3
warmup_epochs: 10