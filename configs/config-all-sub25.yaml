# Wandb settings
project: 'AstroM3'
use_wandb: True

# Dataset settings
dataset: 'AstroMLCore/AstroM3Processed'
classes: ['EW', 'SR', 'EA', 'RRAB', 'EB', 'ROT', 'RRC', 'HADS', 'M', 'DSCT']
num_classes: 10
seq_len: 200
mode: 'all'
data_sub: 'sub25'

# AstroM3 model parameters
hidden_dim: 512
fusion: 'avg'

# Photometry model parameters
p_enc_in: 9
p_d_model: 128
p_dropout: 0.18510349585129432
p_factor: 1
p_output_attention: False
p_n_heads: 4
p_d_ff: 512
p_activation: 'gelu'
p_e_layers: 8

# Spectra model parameters
s_dropout: 0.2368339859667335
s_conv_channels: [3, 64, 64, 32, 32]
s_kernel_size: 3
s_mp_kernel_size: 4

# Metadata model parameters
m_input_dim: 34
m_hidden_dim: 512
m_dropout: 0.18578856175652889

# Training settings
use_pretrain: False
epochs: 50
batch_size: 512
lr: 0.0029842293110715033
beta1: 0.9506759509865552
beta2: 0.999
weight_decay: 0.00026955529466348257
early_stopping_patience: 6
clip_grad: False
save_weights: True
weights_path: './weights/'

# Scheduler settings
scheduler: 'ReduceLROnPlateau'
scheduler_factor: 0.547846870942119
scheduler_patience: 3
warmup_epochs: 10
