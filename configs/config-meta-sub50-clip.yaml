# Wandb settings
project: 'AstroM3'
use_wandb: True

# Dataset settings
dataset: 'MeriDK/AstroM3Processed'
classes: ['EW', 'SR', 'EA', 'RRAB', 'EB', 'ROT', 'RRC', 'HADS', 'M', 'DSCT']
num_classes: 10
seq_len: 200
mode: 'meta'
data_sub: 'sub50'

# Metadata model parameters
m_input_dim: 34
m_hidden_dim: 512
m_dropout: 0.2855296539694589

# Training settings
use_pretrain: True
epochs: 50
batch_size: 512
lr: 0.009829733115290562
beta1: 0.7947084153518845
beta2: 0.999
weight_decay: 0.00010548360002494624
early_stopping_patience: 6
clip_grad: False
save_weights: True
weights_path: './weights/'

# Scheduler settings
scheduler: 'ReduceLROnPlateau'
scheduler_factor: 0.2929050085169224
scheduler_patience: 3
warmup_epochs: 10
